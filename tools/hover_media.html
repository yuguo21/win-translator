<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hover Media Test</title>
<style>
  body { font: 16px/1.6 Georgia, serif; margin: 40px; }
  #card { border: 1px solid #ccc; padding: 16px; width: 420px; margin-bottom: 40px; }
  #wrap2 { border: 1px dashed #999; padding: 20px; width: 520px; }
  img { display: block; margin-bottom: 8px; }
</style>
</head>
<body>
  <h1>Hover Media Test (img must never disappear)</h1>

  <div id="card">
    <img id="pic1" width="200" height="120"
         src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%22120%22%3E%3Crect%20width%3D%22200%22%20height%3D%22120%22%20fill%3D%22%234a90d9%22%2F%3E%3Ctext%20x%3D%2230%22%20y%3D%2270%22%20fill%3D%22white%22%20font-size%3D%2222%22%3EIMAGE%3C%2Ftext%3E%3C%2Fsvg%3E">
    <span id="cap">Hero image caption goes here</span>
  </div>

  <div id="wrap2">
    <img id="pic2" width="160" height="90"
         src="data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22160%22%20height%3D%2290%22%3E%3Crect%20width%3D%22160%22%20height%3D%2290%22%20fill%3D%22%23d97a4a%22%2F%3E%3Ctext%20x%3D%2224%22%20y%3D%2252%22%20fill%3D%22white%22%20font-size%3D%2220%22%3EIMG2%3C%2Ftext%3E%3C%2Fsvg%3E">
    <p>some one like you !</p>
  </div>
</body>
</html>
